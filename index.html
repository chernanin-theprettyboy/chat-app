<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Chat App</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 16px; }
    #messages { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 8px; margin: 8px 0; }
    .msg { margin-bottom: 8px; }
    .msg b { margin-right: 4px; }
    .chat-img { display: block; max-width: 100%; max-height: 300px; margin-top: 4px; border-radius: 8px; }
    .chat-audio { display: block; max-width: 100%; margin-top: 4px; }
    #controls { display: flex; gap: 8px; }
    #text { flex: 1; padding: 8px; }
    #recBtn.recording { background: #e53935; color: white; }
  </style>
</head>
<body>
  <h1>My Chat App</h1>
  <input id="username" placeholder="Your name">
  <div id="messages"></div>

  <div id="controls">
    <input id="text" placeholder="Type a message...">
    <button id="picBtn" title="Send a picture">📷</button>
    <input id="picInput" type="file" accept="image/*" hidden>
    <button id="recBtn" title="Record a voice message">🎤</button>
    <button id="send">Send</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ---------- Connection ----------
    const SUPABASE_URL = 'https://rxuomzlsocvmastvprfl.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_6slxlQG_i8mroPMK3qjY5g_tC-nrMRD';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ---------- Page elements ----------
    const messagesDiv = document.getElementById('messages');
    const textInput = document.getElementById('text');
    const picInput = document.getElementById('picInput');
    const recBtn = document.getElementById('recBtn');

    // ---------- Helpers ----------
    function getUsername() {
      return document.getElementById('username').value.trim() || 'Anonymous';
    }

    function uniqueName(ext) {
      return Date.now() + '-' + Math.random().toString(36).slice(2) + '.' + ext;
    }

    // ---------- Showing messages ----------
    function showMessage(m) {
      const div = document.createElement('div');
      div.className = 'msg';

      const name = document.createElement('b');
      name.textContent = m.username + ':';
      div.append(name);

      if (m.kind === 'image') {
        const img = document.createElement('img');
        img.src = m.file_url;
        img.alt = 'Picture from ' + m.username;
        img.className = 'chat-img';
        img.addEventListener('load', () => {
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
        });
        div.append(img);
      } else if (m.kind === 'voice') {
        const audio = document.createElement('audio');
        audio.controls = true;
        audio.src = m.file_url;
        audio.className = 'chat-audio';
        div.append(audio);
      } else {
        const body = document.createElement('span');
        body.textContent = m.content;
        div.append(body);
      }

      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function loadMessages() {
      const { data, error } = await db.from('messages').select('*').order('created_at');
      if (error) { console.error(error); return; }
      data.forEach(showMessage);
    }

    // ---------- Sending text ----------
    async function sendText() {
      const text = textInput.value.trim();
      if (!text) return;

      const { error } = await db.from('messages').insert({
        username: getUsername(),
        kind: 'text',
        content: text
      });
      if (error) { alert(error.message); return; }
      textInput.value = '';
    }

    // ---------- Sending pictures ----------
    async function sendImage(file) {
      if (file.size > 5 * 1024 * 1024) {
        alert('Picture is too big. Please choose one under 5 MB.');
        return;
      }

      const ext = file.name.split('.').pop();
      const path = uniqueName(ext);

      const { error: uploadError } = await db.storage.from('uploads').upload(path, file);
      if (uploadError) { alert(uploadError.message); return; }

      const { data } = db.storage.from('uploads').getPublicUrl(path);

      const { error } = await db.from('messages').insert({
        username: getUsername(),
        kind: 'image',
        file_url: data.publicUrl
      });
      if (error) alert(error.message);
    }

    // ---------- Sending voice ----------
    let recorder = null;
    let chunks = [];

    async function sendVoice(blob) {
      if (blob.size > 5 * 1024 * 1024) {
        alert('Voice message is too big.');
        return;
      }

      const type = (blob.type || 'audio/webm').split(';')[0];
      const ext = type.includes('mp4') ? 'mp4' : type.includes('ogg') ? 'ogg' : 'webm';
      const path = 'voice-' + uniqueName(ext);

      const { error: uploadError } = await db.storage.from('uploads').upload(path, blob, { contentType: type });
      if (uploadError) { alert(uploadError.message); return; }

      const { data } = db.storage.from('uploads').getPublicUrl(path);

      const { error } = await db.from('messages').insert({
        username: getUsername(),
        kind: 'voice',
        file_url: data.publicUrl
      });
      if (error) alert(error.message);
    }

    async function toggleRecording() {
      // If already recording, this click stops it.
      if (recorder && recorder.state === 'recording') {
        recorder.stop();
        return;
      }

      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        alert('Microphone not available: ' + err.message);
        return;
      }

      chunks = [];
      const thisRecorder = new MediaRecorder(stream);
      recorder = thisRecorder;

      thisRecorder.addEventListener('dataavailable', e => {
        if (e.data.size > 0) chunks.push(e.data);
      });

      thisRecorder.addEventListener('stop', async () => {
        stream.getTracks().forEach(track => track.stop());
        recBtn.classList.remove('recording');
        recBtn.textContent = '🎤';
        const blob = new Blob(chunks, { type: thisRecorder.mimeType });
        await sendVoice(blob);
      });

      thisRecorder.start();
      recBtn.classList.add('recording');
      recBtn.textContent = '⏹';

      // Safety: stop automatically after 60 seconds.
      setTimeout(() => {
        if (thisRecorder.state === 'recording') thisRecorder.stop();
      }, 60000);
    }

    // ---------- Buttons and keys ----------
    document.getElementById('send').addEventListener('click', sendText);
    textInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });

    document.getElementById('picBtn').addEventListener('click', () => picInput.click());
    picInput.addEventListener('change', async () => {
      const file = picInput.files[0];
      if (!file) return;
      await sendImage(file);
      picInput.value = '';
    });

    recBtn.addEventListener('click', toggleRecording);

    // ---------- Realtime ----------
    db.channel('chat')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' },
          payload => showMessage(payload.new))
      .subscribe();

    // ---------- Start ----------
    loadMessages();
  </script>
</body>
</html>
